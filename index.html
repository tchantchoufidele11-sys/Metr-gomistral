<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Test son — Magot</title>
<style>
  body{margin:0;background:#0a1024;color:#eef2f9;font:16px/1.5 -apple-system,system-ui,sans-serif}
  .wrap{max-width:420px;margin:0 auto;padding:24px}
  h1{font:700 20px Georgia,serif}
  p{color:#a9b7d6;font-size:14px}
  button{display:block;width:100%;margin:14px 0;padding:18px;border:0;border-radius:14px;font:700 16px system-ui;cursor:pointer}
  .b1{background:linear-gradient(180deg,#e9b451,#d6952f);color:#241603}
  .b2{background:#18234a;color:#eaf0fb;border:1px solid #2b3a63}
  #log{margin-top:18px;background:#0e1630;border:1px solid #1d2a4d;border-radius:12px;padding:14px;font:13px ui-monospace,monospace;white-space:pre-wrap;min-height:80px}
  .ok{color:#6fe0a0}.warn{color:#ffcf6b}
</style>
</head>
<body>
<div class="wrap">
  <h1>Test du son</h1>
  <p>Appuie sur un bouton. Tu dois entendre un « bip ». Monte le volume et vérifie l'interrupteur latéral (pas d'orange).</p>
  <button class="b1" id="osc">🔊 Bip (oscillateur)</button>
  <button class="b2" id="buf">🔊 Bip (buffer — comme le montage)</button>
  <div id="log">Prêt.</div>
</div>
<script>
"use strict";
var log=document.getElementById("log");
function say(s,cls){ log.innerHTML+="\n"+(cls?'<span class="'+cls+'">'+s+"</span>":s); }
var AC=window.AudioContext||window.webkitAudioContext;
var ctx=null;
function ensure(){
  if(!AC){ say("❌ Web Audio absent sur ce navigateur.","warn"); return null; }
  if(!ctx){ ctx=new AC(); }
  if(ctx.state==="suspended"){ ctx.resume(); }
  return ctx;
}
document.getElementById("osc").onclick=function(){
  var c=ensure(); if(!c) return;
  say("état contexte : "+c.state);
  var g=c.createGain(); g.gain.value=0.25; g.connect(c.destination);
  var o=c.createOscillator(); o.type="sine"; o.frequency.value=440; o.connect(g);
  var t=c.currentTime; o.start(t); o.stop(t+0.7);
  say("▶ bip oscillateur lancé — tu dois l'entendre.","ok");
};
document.getElementById("buf").onclick=function(){
  var c=ensure(); if(!c) return;
  say("état contexte : "+c.state);
  var sr=c.sampleRate, len=Math.floor(sr*0.7);
  var b=c.createBuffer(1,len,sr), d=b.getChannelData(0);
  for(var i=0;i<len;i++){ d[i]=Math.sin(2*Math.PI*440*i/sr)*0.25*(1-i/len); }
  var g=c.createGain(); g.gain.value=1; g.connect(c.destination);
  var s=c.createBufferSource(); s.buffer=b; s.connect(g);
  s.start(c.currentTime+0.02);
  say("▶ bip buffer lancé (chemin exact du montage) — tu dois l'entendre.","ok");
};
</script>
</body>
</html>
