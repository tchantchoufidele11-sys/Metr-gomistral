<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Test overlays — Magot</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#0a1024;color:#eef2f9;font:15px/1.4 -apple-system,system-ui,sans-serif}
  .wrap{max-width:430px;margin:0 auto;padding:14px 14px 46px}
  h1{font:700 18px Georgia,serif;color:#fff;margin:6px 0 2px}
  .sub{color:#9fb0d0;font-size:12.5px;margin:0 0 12px}
  .stage{position:relative;width:100%;aspect-ratio:9/16;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 10px 30px rgba(0,0,0,.5)}
  #bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:linear-gradient(160deg,#12233f,#274a6b 45%,#7c6a52 80%,#c9a06a)}
  #ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;mix-blend-mode:screen;opacity:0}
  .cap{position:absolute;left:10px;bottom:10px;z-index:3;background:rgba(6,12,26,.55);border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:4px 9px;font:600 11px system-ui;color:#dfe7f6}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:12px}
  .btn{border:1px solid #26345c;background:#141d3a;color:#eaf0fb;border-radius:11px;padding:12px 6px;font:600 13px system-ui;cursor:pointer;text-align:center}
  .btn:active{transform:translateY(1px)}
  .btn.on{background:#E0A33E;color:#241603;border-color:#E0A33E}
  .btn.wide{grid-column:1 / -1}
  .btn.stop{grid-column:1 / -1;background:#3a1420;border-color:#5c2130}
  .seg{display:flex;gap:6px;margin-top:10px}
  .seg button{flex:1;border:1px solid #26345c;background:#111a34;color:#c7d3ee;border-radius:9px;padding:9px 4px;font:600 12px system-ui}
  .seg button.on{background:#E0A33E;color:#241603;border-color:#E0A33E}
  .synb{display:flex;align-items:center;gap:10px;margin-top:10px;background:#101a34;border:1px solid #223258;border-radius:11px;padding:10px 12px}
  .synb label{font:600 12px system-ui;color:#c7d3ee;white-space:nowrap}
  .synb input[type=range]{flex:1;accent-color:#E0A33E}
  .synb .val{font:600 12px system-ui;color:#E0A33E;width:52px;text-align:right}
  .hint{color:#7d8cae;font-size:12px;margin-top:12px;line-height:1.55}
  input[type=file]{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>Test overlays vidéo — Magot</h1>
  <p class="sub">Charge une photo, puis tape un effet. Il lit <b>overlays/&lt;nom&gt;.mp4</b> de ton repo et le fusionne en « écran » (le noir disparaît).</p>
  <div class="stage">
    <img id="bg" alt="">
    <video id="ov" playsinline loop muted webkit-playsinline></video>
    <div class="cap" id="cap">—</div>
  </div>

  <div class="grid">
    <button class="btn" data-o="snow">❄️ Neige</button>
    <button class="btn" data-o="rain">🌧️ Pluie</button>
    <button class="btn" data-o="fire">🔥 Feu</button>
    <button class="btn" data-o="bokeh">🌟 Bokeh</button>
    <button class="btn" data-o="lightleak">💡 Fuite lum.</button>
    <button class="btn" data-o="dust">🌫️ Poussière</button>
  </div>

  <div class="synb">
    <label>Intensité</label>
    <input type="range" id="amt" min="0" max="100" step="5" value="85">
    <span class="val" id="amtVal">85 %</span>
  </div>

  <div class="seg" id="blend">
    <button data-b="screen" class="on">Écran</button>
    <button data-b="lighten">Éclaircir</button>
    <button data-b="plus-lighter">Additif</button>
  </div>

  <div class="grid">
    <button class="btn wide" id="pickPhoto">🖼️ Charger une photo</button>
    <button class="btn stop" id="stop">■ Retirer l'effet</button>
  </div>

  <div id="log" class="hint">Dépose tes fichiers dans <b>overlays/</b> : snow.mp4, rain.mp4, fire.mp4, bokeh.mp4, lightleak.mp4, dust.mp4. Commence avec 2-3 pour tester.</div>
  <input type="file" id="fPhoto" accept="image/*">
</div>
<script>
"use strict";
var bg=document.getElementById("bg"), ov=document.getElementById("ov"), cap=document.getElementById("cap"), log=document.getElementById("log");
var amt=document.getElementById("amt"), amtVal=document.getElementById("amtVal");
var photoURL="", current=null;
function say(s){ log.innerHTML=s; }
function amount(){ return (+amt.value)/100; }

var btns=document.querySelectorAll(".btn[data-o]");
function setActive(name){ for(var i=0;i<btns.length;i++){ btns[i].classList.toggle("on", btns[i].getAttribute("data-o")===name); } }

function playOverlay(name){
  current=name; setActive(name);
  cap.textContent="Chargement "+name+"…";
  ov.style.opacity="0";
  ov.onerror=function(){ setActive(""); current=null; cap.textContent="fichier manquant"; say("❌ <b>overlays/"+name+".mp4</b> introuvable. Dépose le fichier dans le dossier <b>overlays/</b> de ton repo (nom exact)."); };
  ov.oncanplay=function(){ ov.oncanplay=null; };
  ov.src="overlays/"+name+".mp4";
  ov.load();
  var pr=ov.play();
  if(pr&&pr.then){ pr.then(function(){ ov.style.opacity=String(amount()); cap.textContent=name+" ✔"; say("overlay <b>"+name+"</b> ✔ — mode écran. Règle l'intensité et compare les modes de fusion."); })
                     .catch(function(err){ cap.textContent="lecture bloquée"; say("lecture bloquée : "+err+" — retape le bouton."); }); }
  else { ov.style.opacity=String(amount()); }
}

for(var i=0;i<btns.length;i++){ (function(b){ b.onclick=function(){ playOverlay(b.getAttribute("data-o")); }; })(btns[i]); }

document.getElementById("stop").onclick=function(){ ov.pause(); ov.removeAttribute("src"); ov.load(); ov.style.opacity="0"; setActive(""); current=null; cap.textContent="—"; say("effet retiré."); };

amt.oninput=function(){ amtVal.textContent=amt.value+" %"; if(current) ov.style.opacity=String(amount()); };

var seg=document.querySelectorAll("#blend button");
for(var j=0;j<seg.length;j++){ (function(b){ b.onclick=function(){ for(var k=0;k<seg.length;k++) seg[k].classList.remove("on"); b.classList.add("on"); ov.style.mixBlendMode=b.getAttribute("data-b"); }; })(seg[j]); }

document.getElementById("pickPhoto").onclick=function(){ document.getElementById("fPhoto").click(); };
document.getElementById("fPhoto").onchange=function(e){ var f=e.target.files&&e.target.files[0]; if(!f) return; try{ if(photoURL) URL.revokeObjectURL(photoURL); }catch(x){} photoURL=URL.createObjectURL(f); bg.src=photoURL; e.target.value=""; };
</script>
</body>
</html>
