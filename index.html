<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>Test particules — PixiJS</title>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@7/dist/pixi.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:#0a1024;color:#eef2f9;font:15px/1.4 -apple-system,system-ui,sans-serif}
  .wrap{max-width:430px;margin:0 auto;padding:14px 14px 40px}
  h1{font:700 18px Georgia,serif;color:#fff;margin:6px 0 2px}
  .sub{color:#9fb0d0;font-size:12.5px;margin:0 0 12px}
  .stage{position:relative;width:100%;aspect-ratio:9/16;border-radius:14px;overflow:hidden;
    background:linear-gradient(160deg,#12233f 0%,#274a6b 45%,#7c6a52 80%,#c9a06a 100%);box-shadow:0 10px 30px rgba(0,0,0,.5)}
  .stage .scene{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12%}
  .stage .scene b{font:700 22px Georgia,serif;color:rgba(255,255,255,.85);text-shadow:0 2px 8px rgba(0,0,0,.4)}
  #pixi{position:absolute;inset:0;z-index:2;pointer-events:none}
  #pixi canvas{width:100%!important;height:100%!important;display:block}
  #fps{position:absolute;top:8px;right:10px;z-index:3;background:rgba(6,12,26,.6);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 9px;font:600 11px ui-monospace,monospace;color:#dfe7f6}
  .row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .btn{flex:1;min-width:46%;border:1px solid #26345c;background:#141d3a;color:#eaf0fb;border-radius:11px;padding:13px;font:600 14px system-ui;cursor:pointer}
  .btn:active{transform:translateY(1px)}
  .btn.stop{background:#3a1420;border-color:#5c2130;flex-basis:100%}
  .hint{color:#7d8cae;font-size:12px;margin-top:12px;line-height:1.5}
  #log{margin-top:10px;font:12px ui-monospace,monospace;color:#9fb0d0}
</style>
</head>
<body>
<div class="wrap">
  <h1>Test particules — PixiJS</h1>
  <p class="sub">Vrai moteur WebGL open-source. Particules à base de vraies textures douces (le secret du réalisme).</p>
  <div class="stage">
    <div class="scene"><b>scène test</b></div>
    <div id="pixi"></div>
    <div id="fps">— fps</div>
  </div>
  <div class="row">
    <button class="btn" id="snow">❄️ Neige</button>
    <button class="btn" id="rain">🌧️ Pluie</button>
  </div>
  <div class="row">
    <button class="btn stop" id="stop">■ Tout arrêter</button>
  </div>
  <div id="log">Chargement du moteur…</div>
  <p class="hint">Compare le réalisme avec tsParticles. Regarde le FPS. Dis-moi : neige / pluie plus crédibles ici ?</p>
</div>
<script>
"use strict";
var log=document.getElementById("log"), fpsEl=document.getElementById("fps"), host=document.getElementById("pixi");
function say(s){ log.textContent=s; }

function boot(){
  if(typeof PIXI==="undefined"){ say("❌ PixiJS non chargé (réseau/CDN ?)."); return; }
  var app;
  try{
    app=new PIXI.Application({ backgroundAlpha:0, antialias:true, autoDensity:true, resolution:Math.min(2,window.devicePixelRatio||1) });
  }catch(e){ say("init PixiJS échouée : "+e); return; }
  host.appendChild(app.view);
  app.view.style.width="100%"; app.view.style.height="100%"; app.view.style.display="block";
  function fit(){ var r=host.getBoundingClientRect(); if(r.width>0) app.renderer.resize(r.width,r.height); }
  fit(); window.addEventListener("resize",fit); setTimeout(fit,300);

  /* texture douce (flocon / goutte) generee en memoire */
  function softTex(){
    var s=64, c=document.createElement("canvas"); c.width=c.height=s; var x=c.getContext("2d");
    var g=x.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
    g.addColorStop(0,"rgba(255,255,255,1)"); g.addColorStop(0.35,"rgba(255,255,255,0.7)"); g.addColorStop(1,"rgba(255,255,255,0)");
    x.fillStyle=g; x.fillRect(0,0,s,s); return PIXI.Texture.from(c);
  }
  var TEX=softTex();
  var container=new PIXI.Container(); app.stage.addChild(container);
  var parts=[], mode=null;

  function clearParts(){ container.removeChildren(); parts.length=0; }
  function makeSnow(){
    clearParts(); mode="snow"; var W=app.screen.width, H=app.screen.height;
    for(var i=0;i<650;i++){
      var s=new PIXI.Sprite(TEX); s.anchor.set(0.5);
      var d=Math.random();                       /* profondeur 0..1 */
      s.scale.set(0.05+d*0.42);
      s.alpha=0.25+d*0.75;
      s.x=Math.random()*W; s.y=Math.random()*H;
      s.vy=18+d*120; s.sway=Math.random()*6.28; s.swayAmp=6+d*26;
      container.addChild(s); parts.push(s);
    }
    say("neige ✔ (PixiJS)");
  }
  function makeRain(){
    clearParts(); mode="rain"; var W=app.screen.width, H=app.screen.height;
    for(var i=0;i<420;i++){
      var s=new PIXI.Sprite(TEX); s.anchor.set(0.5); s.tint=0xbcd6f5;
      var d=Math.random();
      s.scale.set(0.03+d*0.05, 0.35+d*0.75);      /* etire vertical -> traînee */
      s.alpha=0.2+d*0.45;
      s.x=Math.random()*W; s.y=Math.random()*H; s.vy=360+d*520;
      container.addChild(s); parts.push(s);
    }
    say("pluie ✔ (PixiJS)");
  }

  app.ticker.add(function(){
    var W=app.screen.width, H=app.screen.height, dts=app.ticker.deltaMS/1000;
    for(var i=0;i<parts.length;i++){ var s=parts[i];
      s.y+=s.vy*dts;
      if(mode==="snow"){ s.sway+=dts*1.6; s.x+=Math.sin(s.sway)*s.swayAmp*dts; }
      if(s.y>H+24){ s.y=-24; s.x=Math.random()*W; }
      if(s.x<-24){ s.x=W+24; } else if(s.x>W+24){ s.x=-24; }
    }
    fpsEl.textContent=Math.round(app.ticker.FPS)+" fps";
  });

  document.getElementById("snow").onclick=makeSnow;
  document.getElementById("rain").onclick=makeRain;
  document.getElementById("stop").onclick=function(){ clearParts(); mode=null; say("arrêté."); };
  say("moteur prêt ✔ — appuie sur Neige ou Pluie.");
}

(function wait(n){
  if(typeof PIXI!=="undefined"){ boot(); return; }
  if(n<=0){ say("❌ PixiJS non chargé (réseau/CDN ?)."); return; }
  setTimeout(function(){ wait(n-1); }, 300);
})(25);
</script>
</body>
</html>
